spring:
  config:
    import: optional:file:./.env[.properties]
  main:
    banner-mode: OFF
    web-application-type: NONE
  datasource:
    url: jdbc:postgresql://localhost:5432/cli
    username: ${CLI_DB_USERNAME}
    password: ${CLI_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
    schemas: public
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: false
        jdbc:
          batch_size: 10
          lob:
            non_contextual_creation: true
          time_zone: UTC
        order_inserts: true
        order_updates: true
  shell:
    interactive:
      enabled: true

logging:
  level:
    root: off

admin:
  crypto:
    algorithm: AES
    key1: ${CLI_CRYPTO_KEY1}
    key2: ${CLI_CRYPTO_KEY2}
    transformation: AES/CBC/PKCS5PADDING
  minYear: 2013
  storagePath: /media/bruno-domingues/UUI/storage
  filesPath: /home/bruno-domingues/Downloads
