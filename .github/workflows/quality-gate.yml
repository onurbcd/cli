name: Quality Gate
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]

# a new push to the same branch/PR makes the previous run obsolete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build, analyze and quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Sonar needs the full history for blame and new-code detection

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Same as running `./mvnw verify -Plint` locally: Error Prone (compiler), unit tests, JaCoCo report and gate,
      # Spotless import check, then Checkstyle, PMD and SpotBugs in report-only mode so that all of them run and
      # all of their reports exist for the next steps.
      - name: Build, test and analyze
        run: ./mvnw -B --no-transfer-progress verify -Plint

      # Sonar silently imports no coverage when the report is missing, so fail here instead.
      - name: Check coverage report
        run: |
          test -s target/site/jacoco/jacoco.xml
          grep -o '<counter type="LINE"[^>]*/>' target/site/jacoco/jacoco.xml | tail -n 1

      - name: Run SonarQube Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B --no-transfer-progress org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=onurbcd_cli

      # Fails the job when Checkstyle, PMD or SpotBugs reported anything. It runs after Sonar on purpose, so the
      # analysis is published even when this step is red. Tests and JaCoCo already ran above.
      - name: Enforce lint
        run: ./mvnw -B --no-transfer-progress verify -Plint -Dlint.fail=true -DskipTests

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/surefire-reports
            target/site/jacoco
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml
